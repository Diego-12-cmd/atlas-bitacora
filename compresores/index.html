<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ejemplo - flujo de aire compresor</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mut:#6b6b66;--card:#ffffff;--line:#c9c9c2;--acc:#0a7e8c;--hi:#f2a900;--air:#2a6fdb;--vent:#d1495b}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--fg:#ececea;--mut:#9a9a94;--card:#1f201d;--line:#44463f;--acc:#3fc1cf;--hi:#ffc83d;--air:#5a9bff;--vent:#ff6b7a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.sub{margin:4px 0 0;color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.status{color:var(--mut);font-size:13px;margin-left:auto}
.wrap{display:grid;grid-template-columns:1fr 280px;gap:12px;padding:0 18px 18px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.stage{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:auto;height:460px}
svg{display:block;width:920px;height:480px}
.node rect{fill:var(--bg);stroke:var(--line);stroke-width:1.5;cursor:pointer}
.node:hover rect,.node.sel rect{stroke:var(--hi);stroke-width:3}
.node text{font-size:11px;fill:var(--fg);pointer-events:none;text-anchor:middle}
.node .code{font-weight:700;font-size:12px}
.node.ctl rect{stroke-dasharray:4 3}
.pipe{fill:none;stroke-width:6;stroke-linecap:round}
.side{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:14px;font-size:14px;line-height:1.5}
.side h2{font-size:16px;margin:0 0 6px}
.code-tag{color:var(--acc);font-weight:700}
.note{font-size:12px;color:var(--mut);margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Compresor GA - flujo de aire y descarga (ejemplo)</h1>
  <p class="sub">Esquema simplificado según la leyenda de las Fig. 6a y 6b. Esto es un ejemplo de estilo, no el diagrama final.</p>
</header>
<div class="bar">
  <button id="mCarga" class="on">Carga</button>
  <button id="mDesc">Descarga</button>
  <button id="prev">◀ Paso</button>
  <button id="next">Paso ▶</button>
  <button id="zin">+</button>
  <button id="zout">−</button>
  <button id="zreset">100%</button>
  <span id="status" class="status"></span>
</div>
<div class="wrap">
  <div class="stage" id="stage"><svg id="plant" viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside class="side" id="info"><h2>Selecciona un componente</h2><p>Haz clic en una parte del esquema o usa los botones de paso.</p></aside>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('plant');
const stage=document.getElementById('stage');
const info=document.getElementById('info');
const statusEl=document.getElementById('status');
const ORDER=['AF','TV','ASI','EL','Ci','Eh','Ca','CV','AV'];
const NODES=[
 {id:'AF',x:30,y:200,w:80,h:60,t:'Filtro aire'},
 {id:'TV',x:135,y:210,w:50,h:40,t:'Estrang.'},
 {id:'ASI',x:210,y:205,w:70,h:50,t:'Silenc.'},
 {id:'EL',x:305,y:195,w:100,h:70,t:'Etapa BP'},
 {id:'Ci',x:435,y:200,w:90,h:60,t:'Refrig. interm.'},
 {id:'Eh',x:550,y:195,w:100,h:70,t:'Etapa AP'},
 {id:'Ca',x:675,y:200,w:90,h:60,t:'Refrig. post.'},
 {id:'CV',x:790,y:210,w:50,h:40,t:'Retención'},
 {id:'AV',x:855,y:200,w:40,h:60,t:'Salida'},
 {id:'SV1',x:330,y:330,w:80,h:40,t:'Sobrepres.',ctl:1},
 {id:'UA',x:530,y:330,w:90,h:40,t:'Cil. descarga',ctl:1},
 {id:'UV',x:680,y:330,w:70,h:40,t:'Descarga',ctl:1},
 {id:'CM',x:330,y:400,w:100,h:40,t:'Control',ctl:1}
];
const INFO={
 AF:['Filtro de aire','Retiene el polvo del aire de entrada antes de la aspiración.'],
 TV:['Válvula de estrangulación de entrada','Regula cuánto aire entra. En descarga se cierra casi por completo.'],
 ASI:['Silenciador de aspiración','Reduce el ruido del aire que entra al compresor.'],
 EL:['Elemento compresor BP (baja presión)','Primera etapa: comprime el aire por primera vez.'],
 Ci:['Refrigerador intermedio','Enfría el aire entre las dos etapas. Tiene colector de agua (MTi).'],
 Eh:['Elemento compresor AP (alta presión)','Segunda etapa: lleva el aire a la presión de trabajo.'],
 Ca:['Refrigerador posterior','Enfría el aire comprimido a la salida. Tiene colector de agua (MTa).'],
 CV:['Válvula de retención','Evita que el aire regrese hacia el compresor cuando éste se detiene.'],
 AV:['Válvula de salida de aire','Entrega el aire comprimido a la red del cliente.'],
 SV1:['SV1 Válvula de sobrepresión','Limita la presión interna del sistema.'],
 UA:['Cilindro de descarga','Actúa el mecanismo que pasa el compresor a descarga.'],
 UV:['Válvula de descarga','En descarga deja salir el aire a la atmósfera en lugar de enviarlo a la red.'],
 CM:['Módulo de control','Lee sensores de presión y temperatura y comanda las válvulas.']
};
const PATHS={carga:'M 110 230 H 895', descarga:'M 715 260 V 440 H 480'};
let mode='carga', particles=[], cur=-1, z=1;

function build(){
  svg.innerHTML='';
  for(const [k,d] of Object.entries(PATHS)){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('class','pipe'); p.id='p_'+k;
    p.style.stroke = k==='carga' ? 'var(--air)' : 'var(--vent)';
    svg.appendChild(p);
  }
  for(const n of NODES){
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','node'+(n.ctl?' ctl':'')); g.dataset.id=n.id;
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',n.x); r.setAttribute('y',n.y); r.setAttribute('width',n.w); r.setAttribute('height',n.h); r.setAttribute('rx',6);
    g.appendChild(r);
    const t1=document.createElementNS(NS,'text');
    t1.setAttribute('x',n.x+n.w/2); t1.setAttribute('y',n.y+n.h/2-2); t1.setAttribute('class','code'); t1.textContent=n.id;
    g.appendChild(t1);
    const t2=document.createElementNS(NS,'text');
    t2.setAttribute('x',n.x+n.w/2); t2.setAttribute('y',n.y+n.h/2+12); t2.textContent=n.t;
    g.appendChild(t2);
    g.addEventListener('click',()=>select(n.id));
    svg.appendChild(g);
  }
}

function startParticles(){
  particles.forEach(p=>p.el.remove()); particles=[];
  const color = mode==='carga' ? 'var(--air)' : 'var(--vent)';
  for(let i=0;i<14;i++){
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',4); c.style.fill=color; svg.appendChild(c);
    particles.push({el:c,t:i/14});
  }
}

function tick(){
  const path=document.getElementById('p_'+mode);
  const len=path.getTotalLength();
  for(const p of particles){
    p.t=(p.t+0.0035)%1;
    const pt=path.getPointAtLength(p.t*len);
    p.el.setAttribute('cx',pt.x); p.el.setAttribute('cy',pt.y);
  }
  requestAnimationFrame(tick);
}

function setMode(m){
  mode=m;
  document.getElementById('p_carga').style.opacity = m==='carga' ? 1 : .2;
  document.getElementById('p_descarga').style.opacity = m==='descarga' ? 1 : .2;
  document.getElementById('mCarga').classList.toggle('on', m==='carga');
  document.getElementById('mDesc').classList.toggle('on', m==='descarga');
  statusEl.textContent = m==='carga' ? 'Carga: el aire sale hacia la red' : 'Descarga: el aire se vierte a la atmósfera';
  startParticles();
}

function select(id){
  document.querySelectorAll('.node').forEach(g=>g.classList.toggle('sel', g.dataset.id===id));
  const i=ORDER.indexOf(id);
  if(i>=0) cur=i;
  const [name,desc]=INFO[id];
  const step = i>=0 ? `<p class="note">Paso ${i+1} de ${ORDER.length} en la ruta de carga.</p>` : '';
  info.innerHTML=`<h2>${name}</h2><p><span class="code-tag">${id}</span></p><p>${desc}</p>${step}`;
}

function zoom(f){
  z=Math.min(3,Math.max(.6,f));
  svg.style.width=(920*z)+'px';
  svg.style.height=(480*z)+'px';
}

document.getElementById('mCarga').onclick=()=>setMode('carga');
document.getElementById('mDesc').onclick=()=>setMode('descarga');
document.getElementById('next').onclick=()=>select(ORDER[(cur+1)%ORDER.length]);
document.getElementById('prev').onclick=()=>select(ORDER[(cur-1+ORDER.length)%ORDER.length]);
document.getElementById('zin').onclick=()=>zoom(z+.2);
document.getElementById('zout').onclick=()=>zoom(z-.2);
document.getElementById('zreset').onclick=()=>zoom(1);
stage.addEventListener('wheel',e=>{ if(e.ctrlKey){ e.preventDefault(); zoom(z+(e.deltaY<0?.1:-.1)); } },{passive:false});

build();
setMode('carga');
requestAnimationFrame(tick);
</script>
</body>
</html>
